<section class="graph-page">
  <div class="graph-intro">
    <h1>Topics</h1>
    <p>Every tag across the archive, connected where posts share them. Drag to explore, click a topic to filter the
      writing page.</p>
  </div>

  <div class="graph-controls">
    <div class="graph-search-container">
      <div class="graph-search-field">
        <svg aria-hidden="true"><use href="#icon-search"/></svg>
        <input
          type="search"
          id="graph-search-input"
          placeholder="Search topics"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search topics"
        />
      </div>
      <div id="graph-search-results" class="graph-search-results"></div>
    </div>

    <div class="graph-legend">
      <span class="legend-item"><kbd>/</kbd> search</span>
      <span class="legend-item"><kbd>?</kbd> shortcuts</span>
      <span class="legend-item"><kbd>&larr;</kbd><kbd>&rarr;</kbd> move between topics</span>
    </div>
  </div>

  <div class="graph-page-canvas">
    <button class="graph-reset-btn" data-target="global-tag-graph" title="Reset view">Reset</button>
    <svg id="global-tag-graph" class="graph-svg" viewBox="0 0 800 520" width="800" height="520"
      aria-label="Global tag graph"></svg>
  </div>

  <p class="graph-stats" id="graph-stats"></p>
</section>
