<article class="post-container">
    <div class="article-nav">
        <a href="/" class="back-link">
            <svg aria-hidden="true"><use href="#icon-arrow-left"/></svg>
            <span>All posts</span>
        </a>
        <a href="{{url}}" class="source-link" target="_blank" rel="noopener noreferrer">
            <svg aria-hidden="true"><use href="#icon-github"/></svg>
            <span>View source</span>
        </a>
    </div>

    <header class="article-header">
        <p class="article-kicker">
            <time datetime="{{createdAt}}">{{formattedDate}}</time>
            <span class="meta-sep" aria-hidden="true">&middot;</span>
            <span>{{readingTime}} read</span>
        </p>
        <h1 class="article-title">{{title}}</h1>
        {{#hasTags}}
        <div class="article-tags">
            {{#tagList}}
            <button type="button" class="tag post-tag" data-tag="{{name}}" data-hue="{{hue}}">{{name}}</button>
            {{/tagList}}
        </div>
        {{/hasTags}}
    </header>

    <div class="post-content-wrapper{{#hasToc}} has-sidebar{{/hasToc}}">
        <div class="article-body">
            {{htmlContent}}
        </div>

        {{#hasToc}}
        <aside class="toc-sidebar" aria-label="Article outline">
            <nav>
                <h2 class="panel-title">On this page</h2>
                <div class="toc-list">
                    {{#toc}}
                    <div class="toc-item toc-level-{{level}}">
                        <a href="#{{anchor}}" class="toc-link">{{title}}</a>
                    </div>
                    {{/toc}}
                </div>
            </nav>
            <div class="graph-panel">
                <h2 class="panel-title">Related topics</h2>
                <div class="graph-content" data-current-topic="{{currentTopic}}" data-all-topics="{{tagsCsv}}">
                    <button class="graph-reset-btn" data-target="topic-graph" title="Reset view">Reset</button>
                    <svg id="topic-graph" class="graph-svg" viewBox="0 0 220 232" width="220" height="232"
                        aria-label="Topic graph"></svg>
                </div>
            </div>
        </aside>
        {{/hasToc}}
    </div>
</article>
