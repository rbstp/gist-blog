<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{documentTitle}}</title>
    <meta name="description" content="{{metaDescription}}">
    <meta name="author" content="{{author}}">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0f1017" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
    <link rel="canonical" href="{{canonicalUrl}}">

    <!-- Open Graph / Twitter: social cards are generated at build time into /og -->
    <meta property="og:type" content="{{ogType}}">
    <meta property="og:site_name" content="{{siteName}}">
    <meta property="og:title" content="{{ogTitle}}">
    <meta property="og:description" content="{{metaDescription}}">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:image" content="{{ogImageUrl}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{ogImageAlt}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ogTitle}}">
    <meta name="twitter:description" content="{{metaDescription}}">
    <meta name="twitter:image" content="{{ogImageUrl}}">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css?v={{timestamp}}">
    <link rel="preload" href="/fonts/Inter-Variable-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="alternate" type="application/rss+xml" title="rbstp.dev RSS Feed" href="/feed.xml">
</head>

<body data-build-ts="{{timestamp}}">
    <div class="page-aura"></div>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="container">
            <a href="/" class="brand" aria-label="{{siteName}} home">
                <span class="brand-mark" aria-hidden="true">R</span>
                <span class="brand-name">rbstp.dev</span>
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="/" class="nav-link">Writing</a>
                <a href="/graph.html" class="nav-link">Topics</a>
                <a href="https://github.com/rbstp" class="nav-link hide-sm" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a href="/feed.xml" class="icon-btn hide-sm" aria-label="RSS feed">
                    <svg aria-hidden="true"><use href="#icon-rss"/></svg>
                </a>
                <button class="icon-btn theme-toggle" id="theme-toggle" aria-label="Toggle colour theme" data-icon="sun">
                    <svg id="theme-icon" aria-hidden="true"><use href="#icon-sun"/></svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Inline SVG symbol sprite (small, cached with the page) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.64 5.64 7.05 7.05M16.95 16.95l1.41 1.41M16.95 7.05l1.41-1.41M5.64 18.36l1.41-1.41"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3.07 9.5 9.5 0 1 0 21 14.5Z"/>
        </symbol>
        <symbol id="icon-github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.87 10.93c.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.69-3.88-1.54-3.88-1.54-.53-1.34-1.3-1.7-1.3-1.7-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.78 2.72 1.27 3.38.97.11-.75.41-1.27.74-1.56-2.55-.29-5.23-1.28-5.23-5.72 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 2.9-.39 11 11 0 0 1 2.9.39c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.18 1.83 1.18 3.09 0 4.45-2.69 5.43-5.25 5.71.42.36.79 1.07.79 2.16 0 1.56-.01 2.82-.01 3.2 0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></symbol>
        <symbol id="icon-rss" viewBox="0 0 24 24" fill="currentColor"><path d="M6.18 17.82a1.82 1.82 0 1 0 0 3.64 1.82 1.82 0 0 0 0-3.64ZM3 9.55v2.73A8.18 8.18 0 0 1 11.18 20.45h2.73A10.91 10.91 0 0 0 3 9.55Zm0-6v2.73c8.27 0 15 6.73 15 15h2.73c0-9.83-7.9-17.73-17.73-17.73Z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.9-3.9"/>
        </symbol>
        <symbol id="icon-doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
        </symbol>
        <symbol id="icon-hash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M10 3 8 21M16 3l-2 18M3.5 8.5h17M3 15.5h17"/>
        </symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5m0 0 6-6m-6 6 6 6"/>
        </symbol>
        <symbol id="icon-compass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.5-5.5 2 2-5.5Z"/>
        </symbol>
    </svg>

    <main class="container" id="main">
        {{content}}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p class="footer-note">Written by <strong>{{author}}</strong>. Published straight from GitHub gists.</p>
            <nav class="footer-links" aria-label="Elsewhere">
                <a class="footer-link" href="https://github.com/rbstp" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a class="footer-link" href="/feed.xml">RSS</a>
                <a class="footer-link" href="/graph.html">Topics</a>
            </nav>
        </div>
    </footer>

    <script src="/assets/main.js?v={{timestamp}}" defer></script>
    <script src="/assets/command-palette.js?v={{timestamp}}" defer></script>
    <script src="/assets/ux-enhancements.js?v={{timestamp}}" defer></script>
</body>

</html>
